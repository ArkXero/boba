<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boba</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <video class="background" src="video/background.mp4" autoplay muted loop playsinline></video>

    <main class="pane">
        <h1>Enjoy the view!</h1>
        <p id="note" contenteditable="true" spellcheck="false" data-placeholder="Send a message, maybe the future will read it..."></p>
        <p id="sent-label" hidden>Sent into the future</p>
    </main>

    <script src="script.js"></script>
</body>
</html>
